
{% extends "base.html" %}

{% block title %}Sign Up | CampusConnect{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Join CampusConnect</h1>

        <p class="subtitle">
            Create an account and discover your campus network.
        </p>

        <form method="POST" action="{{ url_for('signup') }}">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="primary-btn">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already registered?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>

</div>

{% endblock %}
